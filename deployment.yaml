apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemo-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: kubedemo
  template:
    metadata:
      labels:
        app: kubedemo
    spec:
      containers:
        - name: kubedemo
          image: swathi1276/myapp:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: kubedemo-service
spec:
  type: NodePort
  selector:
    app: kubedemo
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050
