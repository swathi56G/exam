apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemo-deployment
spec: 
  replicas: 4
  selector:
    matchLabels:
      app: kubedemo
  template:
    metadata:
      labels:
        app: kubedemo
    spec:
      containers:
        - nodeport: 5000
      -- image: swathi1276/myapp:latest
      type: NodePort
